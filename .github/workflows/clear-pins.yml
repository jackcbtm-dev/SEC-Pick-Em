name: Clear stale PIN hashes

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute sec-pickem-db --remote --command "UPDATE state SET json = json_set(json, '\$.pins', json('{}')) WHERE id=1;"
          npx wrangler d1 execute sec-pickem-db --remote --command "UPDATE state SET json = json_set(json, '\$.commissionerPinHash', json('null')) WHERE id=1;"
          echo "Cleared all player PINs and the commissioner PIN. Everyone will need to set a new PIN."
